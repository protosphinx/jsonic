[package]
name = "jsonic-protocol"
version = "0.1.0"
edition = "2024"
description = "Reference implementation of the Jsonic B2B blockchain protocol"
authors = ["protosphinx"]
license = "CC-BY-SA-4.0"

[dependencies]
sha2 = "0.10"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.7", features = ["v4"] }
thiserror = "1.0"

[dev-dependencies]
assert_matches = "1.5"
